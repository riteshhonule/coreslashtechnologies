# CoreSlash Technologies — Production NGINX Reverse Proxy Configuration

upstream coreslash_backend {
    server 127.0.0.1:5000 keepalive 32;
}

# HTTP Server — Auto Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.coreslash.com;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.coreslash.com;

    # SSL Certificate Configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.coreslash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.coreslash.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.coreslash.com/chain.pem;

    # SSL Parameters & Security Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max File Upload Limit
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Reverse Proxy to NestJS Backend
    location / {
        proxy_pass http://coreslash_backend;
        proxy_http_version 1.1;

        # Connection & Header Forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer Configuration
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Static File Uploads Cache & Direct Serving (Public static files)
    location /uploads/ {
        alias /var/www/coreslash/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Block direct public access to private resumes
    location /uploads/resumes/ {
        internal;
        return 403;
    }
}
