# ==============================================================================
# CoreSlash Technologies — Production-Safe Nginx Server Configuration
# Target Location on Production VPS: /etc/nginx/sites-available/coreslashtechnologies.com
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name coreslashtechnologies.com www.coreslashtechnologies.com;
    return 301 https://coreslashtechnologies.com$request_uri;
}

# 2. HTTPS www -> non-www Canonical Domain Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coreslashtechnologies.com;

    ssl_certificate /etc/letsencrypt/live/coreslashtechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coreslashtechnologies.com/privkey.pem;

    return 301 https://coreslashtechnologies.com$request_uri;
}

# 3. Main Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coreslashtechnologies.com;

    root /var/www/coreslash/frontend/dist;
    index index.html;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/coreslashtechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coreslashtechnologies.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # API Reverse Proxy (Backend Node/NestJS service on PM2 port 5000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Static Build Assets (JS, CSS, Images, Web Fonts) -> Strict =404
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Root Public Assets (Sitemap, Robots, Logos, Favicon) -> Strict =404
    location ~* ^/(sitemap\.xml|robots\.txt|favicon\.svg|CoreslashTechnologies-solutions-main-logo\.png)$ {
        expires 1d;
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Valid Static & Core SPA Routes -> Return HTTP 200 OK + index.html
    # --------------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(about|portfolio|contact|careers|enquiry-form|partner|partner-program|dealership|partner-form|privacy-policy|terms-of-service|cookie-policy|software-company-in-belagavi|top-it-companies-in-belgavi|top-it-companies-in-belagavi)($|/) {
        try_files /index.html =404;
    }

    # Verified Service Routes
    location ~ ^/services($|/(ai-automation|web-development|website-development|app-development|software-systems|ecommerce-solutions|ecommerce|seo-solutions|seo|shopify-development|cloud-infrastructure|data-analytics))($|/) {
        try_files /index.html =404;
    }

    # Blog Root Page
    location = /blog {
        try_files /index.html =404;
    }

    # Verified Published Blog Articles (Explicit Slugs Matching blogData.ts)
    location ~ ^/blog/(custom-vs-template-website-2026|best-react-js-development-company-in-bangalore|best-software-company-in-belagavi|local-seo-vs-national-seo-guide|ecommerce-website-setup-checklist|custom-software-vs-saas-karnataka|future-of-ai-in-digital-marketing|why-belagavi-businesses-moving-custom-cloud|why-mobile-app-development-booming-tier2|how-to-choose-best-web-design-company-belagavi|best-web-development-company-in-bangalore|best-digital-marketing-agency-in-bangalore|best-seo-company-in-bangalore|latest-trends-website-development-india|scaling-your-brand-digital-marketing-agency|best-digital-marketing-agency-in-hubli|best-digital-marketing-company-in-mysore|best-digital-marketing-company-in-tumkur|coreslash-technologies-best-digital-marketing-agency-in-bangalore|best-digital-marketing-company-in-ballari|best-seo-company-in-bangalore-karnataka|best-digital-marketing-company-in-india|best-web-development-company-in-india|best-it-company-in-hubli|best-digital-marketing-company-in-mangalore|best-ppc-agency-in-karnataka|best-social-media-marketing-company-in-bangalore|best-software-development-company-in-india|digital-transformation-small-businesses|roi-professional-digital-marketing-clinics|how-coreslash-modernizing-it-belagavi|what-to-look-for-hiring-it-consultants|why-every-business-needs-website-2026)($|/) {
        try_files /index.html =404;
    }

    # --------------------------------------------------------------------------
    # Catch-All for Nonexistent / Invalid URLs -> HTTP 404 Not Found
    # Serves /index.html so React Router renders visual <NotFound /> UI with HTTP 404 headers
    # --------------------------------------------------------------------------
    location / {
        error_page 404 /index.html;
        return 404;
    }
}
