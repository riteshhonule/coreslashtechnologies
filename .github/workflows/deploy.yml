name: CoreSlash Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: coreslash_test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies (npm ci)
        run: |
          cd backend
          npm ci

      - name: Verify Prisma Schema Integrity
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/coreslash_test
          DIRECT_URL: postgresql://postgres:testpassword@localhost:5432/coreslash_test
        run: |
          cd backend
          npx prisma validate
          git diff --exit-code -- prisma/schema.prisma

      - name: Compile Production Build
        run: |
          cd backend
          npm run build
